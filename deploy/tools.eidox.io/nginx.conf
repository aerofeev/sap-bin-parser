# nginx, if it serves tools.eidox.io. Goes inside its `server { ... }` block.
#
# The buffering lines matter: by default nginx spools large request and
# response bodies to temporary files on disk, which would store exactly what
# sap-bin is built never to store.

location = /sap-bin-parser {
    return 308 /sap-bin-parser/;
}

location /sap-bin-parser/ {
    proxy_pass http://127.0.0.1:8080;      # no trailing slash: keep the prefix
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 20g;
    proxy_request_buffering off;           # stream uploads straight through
    proxy_buffering off;                   # stream downloads straight back
    proxy_read_timeout 2h;
    proxy_send_timeout 2h;
}
