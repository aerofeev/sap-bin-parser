[package]
name = "sap-bin"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
authors = ["Alexander Erofeev", "eidox ai"]
description = "Convert SAP fixed-width binary table exports (.BIN) to CSV, JSON Lines or Parquet: CLI, local app and store-nothing web service"
license = "MIT"
repository = "https://github.com/aerofeev/sap-bin-parser"
keywords = ["sap", "packed-decimal", "comp-3", "parquet", "etl"]
categories = ["command-line-utilities", "encoding", "parsing"]
default-run = "sap-bin"

[lib]
name = "sap_bin"
path = "src/lib.rs"

[[bin]]
name = "sap-bin"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# The command line, the local app and the web service. Without it the crate
# is the conversion engine alone, which is what the WebAssembly build uses.
server = [
    "dep:axum",
    "dep:bytes",
    "dep:clap",
    "dep:futures-util",
    "dep:multer",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:webbrowser",
    "dep:zstd",
]

[dependencies]
arrow-array = "59.3.0"
arrow-buffer = "59.3.0"
arrow-schema = "59.3.0"
axum = { version = "0.8.9", optional = true }
bytes = { version = "1.12.1", optional = true }
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
crc32fast = "1.5.2"
crossbeam-channel = "0.5.17"
encoding_rs = "0.8.35"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
futures-util = { version = "0.3.34", optional = true }
multer = { version = "3.1.0", optional = true }
parquet = { version = "59.3.0", default-features = false, features = ["arrow", "zstd", "snap", "flate2", "flate2-zlib-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"], optional = true }
tokio-stream = { version = "0.1.19", optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"], optional = true }
# Instant and SystemTime that also work in the browser.
web-time = "1.1.0"
webbrowser = { version = "1.2.4", optional = true }
zstd = { version = "0.13.3", default-features = false, optional = true }

# musl's allocator is slow under threads; static Linux builds use mimalloc.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
